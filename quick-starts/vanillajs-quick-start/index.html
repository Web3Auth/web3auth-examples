<!DOCTYPE html>
<html lang="en">
  <head>
    <script type="module">
      // IMP START - Bundler Issues
      import { Buffer } from "buffer";
      import process from "process";
      window.Buffer = Buffer;
      window.process = process;
      // IMP END - Bundler Issues
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web3Auth VanillaJS Quick Start</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="w3a-example container">
      <h1 class="title">
        <a target="_blank" href="https://docs.metamask.io/embedded-wallets/sdk/js/" rel="noreferrer">
          Web3Auth
        </a>
        & VanillaJS Modal Quick Start
      </h1>

      <!-- IMP START - Login -->
      <div id="logged-out-view" class="grid">
        <button id="login-btn" class="card" type="button">Login</button>
        <div id="connect-loading" class="loading" style="display: none">Connecting...</div>
        <div id="connect-error" class="error" style="display: none"></div>
      </div>
      <!-- IMP END - Login -->

      <div id="logged-in-view" class="grid" style="display: none">
        <h2>Connected to <span id="connector-name"></span></h2>
        <!-- IMP START - Blockchain Calls -->
        <div id="user-address"></div>
        <!-- IMP END - Blockchain Calls -->
        <div class="flex-container">
          <div>
            <button id="get-user-info-btn" class="card" type="button">Get User Info</button>
          </div>
          <!-- IMP START - Logout -->
          <div>
            <button id="logout-btn" class="card" type="button">Log Out</button>
            <div id="disconnect-loading" class="loading" style="display: none">Disconnecting...</div>
            <div id="disconnect-error" class="error" style="display: none"></div>
          </div>
          <!-- IMP END - Logout -->
        </div>

        <!-- IMP START - Blockchain Calls -->
        <div>
          <h2>Send Transaction</h2>
          <form id="send-tx-form">
            <input name="address" placeholder="Address" required />
            <input
              name="value"
              placeholder="Amount (ETH)"
              type="number"
              step="0.000000001"
              required
            />
            <button type="submit">Send</button>
          </form>
          <div id="send-hash"></div>
          <div id="send-confirming" style="display: none">Waiting for confirmation...</div>
          <div id="send-confirmed" style="display: none">Transaction confirmed.</div>
          <div id="send-error" class="error" style="display: none"></div>
        </div>

        <div>
          <h2>Balance</h2>
          <div>
            <span id="balance-value"></span>
            <span id="balance-loading" style="display: none">Loading...</span>
            <span id="balance-error" class="error" style="display: none"></span>
          </div>
        </div>

        <div>
          <h2>Sign Message</h2>
          <form id="sign-message-form">
            <input name="message" placeholder="Message" required />
            <button type="submit">Sign</button>
          </form>
          <div id="sign-signature" class="signature"></div>
          <div id="sign-error" class="error" style="display: none"></div>
        </div>

        <div>
          <h2>Switch Chain</h2>
          <h3>Connected to <span id="chain-id"></span></h3>
          <div id="switch-chain-buttons" class="flex-row"></div>
          <div id="switch-chain-error" class="error" style="display: none"></div>
        </div>
        <!-- IMP END - Blockchain Calls -->
      </div>

      <div id="console" style="white-space: pre-line">
        <p style="white-space: pre-line"></p>
      </div>

      <footer class="footer">
        <a
          href="https://github.com/Web3Auth/web3auth-examples/tree/main/quick-starts/vanillajs-quick-start"
          target="_blank"
          rel="noopener noreferrer"
        >
          Source code
        </a>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
